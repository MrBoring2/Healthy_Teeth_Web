services:
  proxy:
    container_name: Proxy
    image: proxy_nginx:v1
    build:
        context: .
        dockerfile: Proxy/Dockerfile
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
    ports:
        -  "1081:80"
        -  "1044:443"
    restart: unless-stopped
    networks:
      healthy-teeth-network:
  db:
    container_name: healthy-teeth-db
    image: postgres:16
    environment:
      POSTGRES_DB: "healthy-teeth"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5433:5432"
    volumes:
      - healthy-teeth-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      healthy-teeth-network:
  api:
    container_name: healthy-teeth-api
    image: ${DOCKER_REGISTRY-}web-api:v1
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
      # - ASPNETCORE_Kestrel__Certificates__Default__Password=0798661
      # - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/healthy-teeth.pfx
      - TZ=Asia/Yekaterinburg
    ports:
      - "8081:80"
      # - "8082:443"
    volumes:
      # - ~/.aspnet/https:/https:ro
      - .healthy-teeth-api-logs:/logger/logs
      # - healthy-teeth-api-logs:/logger/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      healthy-teeth-network:
  web:
    image: web_site:v1
    build:
      context: .
      dockerfile: WebSite/Dockerfile
    environment:
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "8083:80"
      # - "8084:443"
    volumes:
      - ~/.aspnet/https:/https:ro
    networks:
      healthy-teeth-network:

volumes:
  healthy-teeth-pgdata:
  healthy-teeth-api-logs:
  certificates:

networks:
  healthy-teeth-network:
    

